<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3E2723" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Add Product — Crumble & Cream</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<button id="dash-hamburger" class="dash-hamburger" aria-label="Menu"><span></span></button>
<div id="dash-scrim" class="dash-scrim"></div>
<div class="dash-layout">
  <aside class="dash-sidebar">
    <a href="index.html" class="logo">Crumble <em>&</em> Cream</a>
    <nav class="dash-nav">
      <a href="baker-dashboard.html">Dashboard</a>
      <a href="baker-dashboard.html">Orders</a>
      <a href="baker-products.html">Products</a>
      <a href="baker-add-product.html" class="active">Add Product</a>
      <a href="baker-customers.html">Customers</a>
      <a href="baker-reviews.html">Reviews</a>
      <a href="baker-messages.html">Messages</a>
      <a href="baker-settings.html">Settings</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </aside>

  <main class="dash-main">
    <h2 style="margin-bottom:0.3rem;">Add Product</h2>
    <p style="color:var(--brown-mid); margin-bottom:1.5rem;">This will appear live on the site immediately after saving.</p>

    <div class="order-card" style="max-width:560px; padding:var(--space-lg);">
      <div class="form-group"><label>Product Name *</label><input id="p-name" placeholder="e.g. Chocolate Truffle Cake" /></div>

      <div class="form-group">
        <label>Category *</label>
        <select id="p-category" style="width:100%; padding:0.85rem 1rem; border:1.5px solid var(--line); border-radius:var(--radius-sm);"></select>
      </div>

      <div style="display:flex; gap:1rem;">
        <div class="form-group" style="flex:1;"><label>Price (Rs.) *</label><input id="p-price" type="number" min="0" /></div>
        <div class="form-group" style="flex:1;"><label>Old Price (optional)</label><input id="p-oldPrice" type="number" min="0" /></div>
      </div>

      <div class="form-group">
        <label>Image URL *</label>
        <input id="p-image" placeholder="https://images.unsplash.com/..." />
        <p style="font-size:0.78rem; color:var(--brown-mid); margin-top:0.3rem;">Paste a direct image link (e.g. from Unsplash). File upload isn't set up yet.</p>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="p-description" rows="3" style="width:100%; padding:0.85rem 1rem; border:1.5px solid var(--line); border-radius:var(--radius-sm);" placeholder="Short description shown on the product page"></textarea>
      </div>

      <div style="display:flex; align-items:center; gap:0.6rem; margin-bottom:1rem;">
        <input type="checkbox" id="p-featured" />
        <label for="p-featured" style="cursor:pointer;">Show in homepage "Featured Products" section</label>
      </div>

      <button id="p-submit" class="btn btn-primary magnetic" style="width:100%; margin-top:0.5rem;">Add Product</button>
    </div>
  </main>
</div>

<script type="module">
  import { protectPage, logout } from './js/auth.js';
  import { initDashNav } from './js/dash-nav.js';
  initDashNav();
  import { addProduct, PRODUCT_CATEGORIES } from './js/baker-admin.js';
  import { showToast } from './js/toast.js';

  document.getElementById('p-category').innerHTML = PRODUCT_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');

  protectPage('baker');

  document.getElementById('p-submit').addEventListener('click', async () => {
    const name = document.getElementById('p-name').value.trim();
    const category = document.getElementById('p-category').value;
    const price = parseFloat(document.getElementById('p-price').value);
    const image = document.getElementById('p-image').value.trim();

    if (!name || !image || isNaN(price)) {
      showToast('Name, price, and image URL are required.', 'error');
      return;
    }

    const oldPriceVal = document.getElementById('p-oldPrice').value;

    try {
      await addProduct({
        name,
        category,
        price,
        oldPrice: oldPriceVal ? parseFloat(oldPriceVal) : null,
        image,
        description: document.getElementById('p-description').value.trim(),
        featured: document.getElementById('p-featured').checked,
        rating: 5
      });
      showToast('Product added!');
      document.getElementById('p-name').value = '';
      document.getElementById('p-price').value = '';
      document.getElementById('p-oldPrice').value = '';
      document.getElementById('p-image').value = '';
      document.getElementById('p-description').value = '';
      document.getElementById('p-featured').checked = false;
    } catch (err) {
      console.error(err);
      showToast('Could not add product.', 'error');
    }
  });

  document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); logout(); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
