<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3E2723" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>My Profile — Crumble & Cream</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<button id="dash-hamburger" class="dash-hamburger" aria-label="Menu"><span></span></button>
<div id="dash-scrim" class="dash-scrim"></div>
<div class="dash-layout">
  <aside class="dash-sidebar">
    <a href="index.html" class="logo">Crumble <em>&</em> Cream</a>
    <nav class="dash-nav">
      <a href="customer-dashboard.html">Dashboard</a>
      <a href="wishlist.html">Favorites</a>
      <a href="customer-profile.html" class="active">My Profile</a>
      <a href="customer-addresses.html">Saved Addresses</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </aside>

  <main class="dash-main">
    <h2 style="margin-bottom:0.3rem;">My Profile</h2>
    <p style="color:var(--brown-mid); margin-bottom:1.5rem;">Update your name and phone number.</p>

    <div class="order-card" style="max-width:480px; padding:var(--space-lg);">
      <div class="form-group"><label>Full Name</label><input id="pf-name" /></div>
      <div class="form-group"><label>Email</label><input id="pf-email" disabled style="opacity:0.6;" /></div>
      <div class="form-group"><label>Phone</label><input id="pf-phone" /></div>
      <button id="pf-save" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Save Changes</button>
    </div>
  </main>
</div>

<script type="module">
  import { protectPage, logout } from './js/auth.js';
  import { initDashNav } from './js/dash-nav.js';
  initDashNav();
  import { isFirebaseConfigured } from './js/products.js';
  import { updateDemoUser } from './js/demo-store.js';
  import { showToast } from './js/toast.js';
  import { db } from './js/firebase-config.js';
  import { doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  let currentUid = null;

  protectPage('customer').then(({ user, profile }) => {
    currentUid = user.uid;
    document.getElementById('pf-name').value = profile?.name || '';
    document.getElementById('pf-email').value = profile?.email || user.email || '';
    document.getElementById('pf-phone').value = profile?.phone || '';
  });

  document.getElementById('pf-save').addEventListener('click', async () => {
    const name = document.getElementById('pf-name').value.trim();
    const phone = document.getElementById('pf-phone').value.trim();
    if (!name) { showToast('Name is required.', 'error'); return; }

    try {
      if (!isFirebaseConfigured()) {
        updateDemoUser(currentUid, { name, phone });
      } else {
        await updateDoc(doc(db, 'users', currentUid), { name, phone });
      }
      showToast('Profile updated!');
    } catch (err) {
      console.error(err);
      showToast('Could not save changes.', 'error');
    }
  });

  document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); logout(); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
