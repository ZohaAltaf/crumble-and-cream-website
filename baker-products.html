<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3E2723" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Manage Products — Crumble & Cream</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<button id="dash-hamburger" class="dash-hamburger" aria-label="Menu"><span></span></button>
<div id="dash-scrim" class="dash-scrim"></div>
<div class="dash-layout">
  <aside class="dash-sidebar">
    <a href="index.html" class="logo">Crumble <em>&</em> Cream</a>
    <nav class="dash-nav">
      <a href="baker-dashboard.html">Dashboard</a>
      <a href="baker-dashboard.html">Orders</a>
      <a href="baker-products.html" class="active">Products</a>
      <a href="baker-add-product.html">Add Product</a>
      <a href="baker-customers.html">Customers</a>
      <a href="baker-reviews.html">Reviews</a>
      <a href="baker-messages.html">Messages</a>
      <a href="baker-settings.html">Settings</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
      <div>
        <h2 style="margin-bottom:0.3rem;">Products</h2>
        <p style="color:var(--brown-mid);">Edit or remove items customers see on the site.</p>
      </div>
      <a href="baker-add-product.html" class="btn btn-primary">+ Add Product</a>
    </div>

    <div id="products-list">
      <p style="color:var(--brown-mid);">Loading products...</p>
    </div>
  </main>
</div>

<!-- Edit panel (hidden until "Edit" is clicked) -->
<div id="edit-overlay" style="display:none; position:fixed; inset:0; background:rgba(62,39,35,0.45); z-index:50; align-items:center; justify-content:center;">
  <div style="background:var(--warm-white); border-radius:var(--radius-md); padding:var(--space-lg); width:90%; max-width:480px; max-height:85vh; overflow-y:auto;">
    <h3 style="margin-bottom:1rem;">Edit Product</h3>
    <div class="form-group"><label>Name</label><input id="e-name" /></div>
    <div class="form-group">
      <label>Category</label>
      <select id="e-category" style="width:100%; padding:0.85rem 1rem; border:1.5px solid var(--line); border-radius:var(--radius-sm);"></select>
    </div>
    <div class="form-group"><label>Price (Rs.)</label><input id="e-price" type="number" min="0" /></div>
    <div class="form-group"><label>Old Price (optional, for showing a discount)</label><input id="e-oldPrice" type="number" min="0" /></div>
    <div class="form-group"><label>Image URL</label><input id="e-image" /></div>
    <div class="form-group"><label>Description</label><textarea id="e-description" rows="3" style="width:100%; padding:0.85rem 1rem; border:1.5px solid var(--line); border-radius:var(--radius-sm);"></textarea></div>
    <div style="display:flex; align-items:center; gap:0.6rem; margin-bottom:1rem;">
      <input type="checkbox" id="e-featured" />
      <label for="e-featured" style="cursor:pointer;">Show in homepage "Featured Products" section</label>
    </div>
    <div style="display:flex; gap:0.8rem; margin-top:1rem;">
      <button id="e-save" class="btn btn-primary" style="flex:1;">Save Changes</button>
      <button id="e-cancel" class="btn btn-outline" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
  import { protectPage, logout } from './js/auth.js';
  import { initDashNav } from './js/dash-nav.js';
  initDashNav();
  import { loadAllProductsForAdmin, updateProduct, deleteProduct, PRODUCT_CATEGORIES } from './js/baker-admin.js';
  import { showToast } from './js/toast.js';
  import { escapeHTML } from './js/products.js';

  document.getElementById('e-category').innerHTML = PRODUCT_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');

  let products = [];
  let editingId = null;

  function render() {
    const list = document.getElementById('products-list');
    if (products.length === 0) {
      list.innerHTML = `<p style="color:var(--brown-mid);">No products yet. Click "+ Add Product" to create your first one.</p>`;
      return;
    }
    list.innerHTML = products.map(p => `
      <div class="order-card" style="display:flex; align-items:center; gap:1rem;">
        <img src="${escapeHTML(p.image) || 'https://images.unsplash.com/photo-1535911765168-1fafc87dcfa3?auto=format&fit=crop&w=200&q=80'}" alt="${escapeHTML(p.name)}" style="width:64px; height:64px; border-radius:var(--radius-sm); object-fit:cover; flex-shrink:0;" />
        <div style="flex:1;">
          <div style="font-weight:500;">${escapeHTML(p.name)}</div>
          <div style="font-size:0.82rem; color:var(--brown-mid);">${escapeHTML(p.category)} · Rs. ${p.price?.toLocaleString() || 0}</div>
        </div>
        <button class="btn btn-outline edit-btn" data-id="${p.id}" style="padding:0.5rem 1rem; font-size:0.82rem;">Edit</button>
        <button class="btn btn-outline delete-btn" data-id="${p.id}" style="padding:0.5rem 1rem; font-size:0.82rem; border-color:#b23b2f; color:#b23b2f;">Delete</button>
      </div>
    `).join('');

    list.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openEdit(btn.dataset.id)));
    list.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => onDelete(btn.dataset.id)));
  }

  function openEdit(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById('e-name').value = p.name || '';
    document.getElementById('e-category').value = p.category || PRODUCT_CATEGORIES[0];
    document.getElementById('e-price').value = p.price || 0;
    document.getElementById('e-oldPrice').value = p.oldPrice || '';
    document.getElementById('e-image').value = p.image || '';
    document.getElementById('e-description').value = p.description || '';
    document.getElementById('e-featured').checked = !!p.featured;
    document.getElementById('edit-overlay').style.display = 'flex';
  }

  document.getElementById('e-cancel').addEventListener('click', () => {
    document.getElementById('edit-overlay').style.display = 'none';
    editingId = null;
  });

  document.getElementById('e-save').addEventListener('click', async () => {
    if (!editingId) return;
    const name = document.getElementById('e-name').value.trim();
    const price = parseFloat(document.getElementById('e-price').value);
    if (!name || isNaN(price)) { showToast('Name and price are required.', 'error'); return; }

    const data = {
      name,
      category: document.getElementById('e-category').value,
      price,
      image: document.getElementById('e-image').value.trim(),
      description: document.getElementById('e-description').value.trim(),
      featured: document.getElementById('e-featured').checked
    };
    const oldPriceVal = document.getElementById('e-oldPrice').value;
    data.oldPrice = oldPriceVal ? parseFloat(oldPriceVal) : null;

    try {
      await updateProduct(editingId, data);
      Object.assign(products.find(p => p.id === editingId), data);
      render();
      document.getElementById('edit-overlay').style.display = 'none';
      showToast('Product updated!');
    } catch (err) {
      console.error(err);
      showToast('Could not save changes.', 'error');
    }
  });

  async function onDelete(id) {
    if (!confirm('Delete this product? This cannot be undone.')) return;
    try {
      await deleteProduct(id);
      products = products.filter(p => p.id !== id);
      render();
      showToast('Product deleted.');
    } catch (err) {
      console.error(err);
      showToast('Could not delete product.', 'error');
    }
  }

  protectPage('baker').then(async () => {
    try {
      products = await loadAllProductsForAdmin();
      render();
    } catch (err) {
      console.error(err);
      document.getElementById('products-list').innerHTML = `<p style="color:var(--brown-mid);">Could not load products.</p>`;
    }
  });

  document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); logout(); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
