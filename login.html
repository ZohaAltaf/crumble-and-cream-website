<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3E2723" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Login — Crumble & Cream</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual" style="background-image:url('https://images.unsplash.com/photo-1535911765168-1fafc87dcfa3?auto=format&fit=crop&w=1600&q=80');background-size:cover;background-position:center;">
    <div class="content">
      <h2>Welcome Back</h2>
      <p>Log in to track your orders, manage favorites, and reorder your go-to treats.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-box">
      <a href="index.html" class="logo">Crumble <em>&</em> Cream</a>
      <h3>Login to your account</h3>

      <form id="login-form" style="margin-top:1.6rem;">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required minlength="6" />
        </div>

        <button type="submit" class="btn btn-primary auth-submit magnetic">Login</button>
      </form>

      <div class="auth-divider">or</div>

      <button id="google-login" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3l5.7-5.7C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.9 1.1 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.6 0-14.1 4.3-17.4 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.3C29.3 35.4 26.8 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.8 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.2 5.3C40.8 36 44 30.8 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </button>

      <div class="auth-links">
        <a href="#" id="forgot-password-link">Forgot Password?</a>
        <a href="signup.html">Create Account</a>
      </div>

      <p id="demo-hint" style="margin-top:1.4rem; font-size:0.78rem; color:var(--brown-mid); background:#f7f1e8; border-radius:var(--radius-sm); padding:0.7rem 0.9rem;"></p>
    </div>
  </div>
</div>

<script type="module">
  import { isFirebaseConfigured } from './js/products.js';
  if (!isFirebaseConfigured()) {
    document.getElementById('demo-hint').innerHTML =
      'Demo mode (Firebase not connected yet): sign up for a customer account, or test the baker dashboard with <strong>baker@demo.com</strong> / <strong>baker123</strong>.';
  }
</script>

<script type="module">
  import { login, loginWithGoogle, forgotPassword } from './js/auth.js';

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    login(email, password);
  });

  document.getElementById('google-login').addEventListener('click', loginWithGoogle);

  document.getElementById('forgot-password-link').addEventListener('click', (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    if (!email) {
      import('./js/toast.js').then(({ showToast }) => showToast('Enter your email first, then click "Forgot Password?"', 'error'));
      return;
    }
    forgotPassword(email);
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
